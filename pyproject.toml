[project]
name = "sport-data-solution-benefits-poc"
version = "0.1.0"
description = "Plateforme de donnees temps reel et Lakehouse pour le calcul et le suivi des avantages sportifs collaborateurs chez Sport Data Solution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
    "confluent-kafka>=2.6.0",
    "deltalake>=1.0.0",
    "duckdb>=1.1.0",
    "httpx>=0.27.2",
    "openpyxl>=3.1.5",
    "pg8000>=1.31.2",
    "polars>=1.12.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "setuptools>=75.0.0,<81.0.0",
    "soda-core-duckdb>=3.5.0",
    "sqlalchemy>=2.1.9",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "jupyterlab>=4.3.0",
    "matplotlib>=3.9.2",
    "pandas>=2.2.3",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.3",
    "seaborn>=0.13.2",
]

[tool.uv]
override-dependencies = [
    "duckdb>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
timid = true
disable_warnings = ["no-ctracer"]