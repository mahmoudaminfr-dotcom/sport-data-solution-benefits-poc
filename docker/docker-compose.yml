name: sds-benefits-platform

services:
  postgres:
    image: "postgres:16-alpine"
    container_name: sds-postgres
    restart: "no"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sds_platform}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-sds_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      SDS_PIPELINE_USER: "${SDS_PIPELINE_USER:-sds_pipeline}"
      SDS_PIPELINE_PASSWORD: "${SDS_PIPELINE_PASSWORD}"
      SDS_DEBEZIUM_USER: "${SDS_DEBEZIUM_USER:-sds_debezium}"
      SDS_DEBEZIUM_PASSWORD: "${SDS_DEBEZIUM_PASSWORD}"
      SDS_BI_READER_USER: "${SDS_BI_READER_USER:-sds_bi_reader}"
      SDS_BI_READER_PASSWORD: "${SDS_BI_READER_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "sds_pg_data:/var/lib/postgresql/data"
      - "./postgres/01_init_platform.sh:/docker-entrypoint-initdb.d/01_init_platform.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-sds_admin} -d ${POSTGRES_DB:-sds_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sds-net

  minio:
    image: "pgsty/silo:latest"
    container_name: sds-minio
    restart: "no"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-sds_minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - "sds_minio_data:/data"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sds-net

  redpanda:
    image: "docker.redpanda.com/redpandadata/redpanda:latest"
    container_name: sds-redpanda
    restart: "no"
    command:
      - "redpanda"
      - "start"
      - "--mode"
      - "dev-container"
      - "--smp"
      - "1"
      - "--memory"
      - "512M"
      - "--kafka-addr"
      - "internal://0.0.0.0:9092,external://0.0.0.0:19092"
      - "--advertise-kafka-addr"
      - "internal://sds-redpanda:9092,external://localhost:19092"
    ports:
      - "19092:19092"
    volumes:
      - "sds_redpanda_data:/var/lib/redpanda/data"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
      interval: 8s
      timeout: 5s
      retries: 10
    networks:
      - sds-net

  redpanda-console:
    image: "docker.redpanda.com/redpandadata/console:latest"
    container_name: sds-redpanda-console
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
      debezium:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "sds-redpanda:9092"
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: "sds-debezium"
      CONNECT_CLUSTERS_URL: "http://sds-debezium:8083"
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    networks:
      - sds-net

  debezium:
    image: "quay.io/debezium/connect:2.7"
    container_name: sds-debezium
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: "sds-redpanda:9092"
      GROUP_ID: "sds-cdc-cluster"
      CONFIG_STORAGE_TOPIC: "_sds_cdc_configs"
      OFFSET_STORAGE_TOPIC: "_sds_cdc_offsets"
      STATUS_STORAGE_TOPIC: "_sds_cdc_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: "-Xms256M -Xmx768M"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/connectors"]
      start_period: 25s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sds-net

  kestra-init:
    image: "kestra/kestra:latest"
    container_name: sds-kestra-init
    profiles:
      - "orchestration"
    restart: "no"
    user: "0:0"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "mkdir -p /app/storage/sds-venv /app/storage/uv-cache && chown -R 1000:1000 /app/storage"
    volumes:
      - "sds_kestra_data:/app/storage"
    networks:
      - sds-net

  kestra:
    image: "kestra/kestra:latest"
    container_name: sds-kestra
    profiles:
      - "orchestration"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kestra-init:
        condition: service_completed_successfully
    command: ["server", "local"]
    environment:
      KESTRA_CONFIGURATION: |
        micronaut:
          server:
            port: 8080
        kestra:
          tutorial-flows:
            enabled: false
          anonymous-usage-report:
            enabled: false
          server:
            basic-auth:
              enabled: true
              username: "${KESTRA_BASIC_AUTH_USERNAME:-ops@sportdatasolution.fr}"
              password: "${KESTRA_BASIC_AUTH_PASSWORD:-SdsKestraOps2026!}"
      POSTGRES_HOST: "sds-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB:-sds_platform}"
      POSTGRES_ADMIN_USER: "${POSTGRES_ADMIN_USER:-sds_admin}"
      POSTGRES_ADMIN_PASSWORD: "${POSTGRES_ADMIN_PASSWORD}"
      SDS_PIPELINE_USER: "${SDS_PIPELINE_USER:-sds_pipeline}"
      SDS_PIPELINE_PASSWORD: "${SDS_PIPELINE_PASSWORD}"
      SDS_DEBEZIUM_USER: "${SDS_DEBEZIUM_USER:-sds_debezium}"
      SDS_DEBEZIUM_PASSWORD: "${SDS_DEBEZIUM_PASSWORD}"
      SDS_BI_READER_USER: "${SDS_BI_READER_USER:-sds_bi_reader}"
      SDS_BI_READER_PASSWORD: "${SDS_BI_READER_PASSWORD}"
      MINIO_ENDPOINT: "http://sds-minio:9000"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-sds_minio_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
      MINIO_REGION: "${MINIO_REGION:-eu-west-3}"
      MINIO_BUCKET_RAW: "${MINIO_BUCKET_RAW:-sds-raw-referentials}"
      MINIO_BUCKET_BRONZE: "${MINIO_BUCKET_BRONZE:-sds-bronze}"
      MINIO_BUCKET_SILVER: "${MINIO_BUCKET_SILVER:-sds-silver}"
      MINIO_BUCKET_GOLD: "${MINIO_BUCKET_GOLD:-sds-gold}"
      REDPANDA_BROKERS: "sds-redpanda:9092"
      DEBEZIUM_CONNECT_URL: "http://sds-debezium:8083"
      REDPANDA_ACTIVITY_TOPIC: "${REDPANDA_ACTIVITY_TOPIC:-sds.oltp_sports.sport_activities}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"
      SLACK_CHANNEL_NAME: "${SLACK_CHANNEL_NAME:-#defis-sportifs-sds}"
      SLACK_NOTIFICATIONS_ENABLED: "${SLACK_NOTIFICATIONS_ENABLED:-true}"
      SDS_PII_HASH_SALT: "${SDS_PII_HASH_SALT}"
      UV_PROJECT_ENVIRONMENT: "/app/storage/sds-venv"
      UV_CACHE_DIR: "/app/storage/uv-cache"
      UV_PYTHON: "/usr/bin/python3"
      UV_PYTHON_DOWNLOADS: "never"
      SODA_TELEMETRY_DISABLED: "true"
      DO_NOT_TRACK: "1"
    ports:
      - "${KESTRA_PORT:-8085}:8080"
    volumes:
      - "sds_kestra_data:/app/storage"
      - "../flows:/app/flows:ro"
      - "../pyproject.toml:/workspace/pyproject.toml:ro"
      - "../uv.lock:/workspace/uv.lock:ro"
      - "../README.md:/workspace/README.md:ro"
      - "../config:/workspace/config:ro"
      - "../src:/workspace/src:ro"
      - "../scripts:/workspace/scripts:ro"
      - "../data/raw:/workspace/data/raw:ro"
      - "../data/cache:/workspace/data/cache"
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/configs/login', timeout=4)"
      start_period: 25s
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - sds-net

volumes:
  sds_pg_data: {}
  sds_minio_data: {}
  sds_redpanda_data: {}
  sds_kestra_data: {}

networks:
  sds-net:
    driver: bridge